name: Build and verify
on: [push, pull_request]
jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet build -c Release
      - run: dotnet run --project tests/SardinasPatterson.Tests -c Release --no-build
      - run: dotnet run --project src/SardinasPatterson.Cli -c Release --no-build -- analyze --input examples/ambiguous.json --format json --svg report.svg
